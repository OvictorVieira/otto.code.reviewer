name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="build/${os}_${arch}"
            mkdir -p "$out"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out/otto" ./cmd/otto
            cp LICENSE.md NOTICE README.md "$out/"
            tar -C "$out" -czf "dist/otto_${os}_${arch}.tar.gz" otto LICENSE.md NOTICE README.md
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's#\./##' > checksums.txt)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
